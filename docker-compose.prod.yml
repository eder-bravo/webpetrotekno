# Docker Compose para PRODUCCIÓN en Dokploy
#
# Los servicios DEBEN estar en dokploy-network para Traefik
#
# Variables de entorno requeridas:
#   - APP_KEY: Clave de encriptación de Laravel
#   - BACKEND_URL: URL completa del backend (ej: https://cms.ejemplo.com)
#   - BACKEND_DOMAIN: Dominio del backend sin protocolo (ej: cms.ejemplo.com)
#   - FRONTEND_DOMAIN: Dominio del frontend sin protocolo (ej: www.ejemplo.com)

services:
  backend:
    build:
      context: ./petrotekno-cms
      dockerfile: Dockerfile
    container_name: petrotekno-backend
    environment:
      - APP_NAME=${APP_NAME:-Petrotekno CMS}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - PANEL_ACCESS_CODE=${PANEL_ACCESS_CODE}
      - APP_DEBUG=false
      - APP_URL=${BACKEND_URL}
      - APP_LOCALE=es
      - APP_FALLBACK_LOCALE=es
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/data/database.sqlite
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
    volumes:
      - petrotekno_storage:/var/www/html/storage/app/public
      - petrotekno_database:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/config" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dokploy-network
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.petrotekno-backend.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.petrotekno-backend.entrypoints=websecure"
      - "traefik.http.routers.petrotekno-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.petrotekno-backend.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./webpetrotekno
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL}
    container_name: petrotekno-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-network
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.petrotekno-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.petrotekno-frontend.entrypoints=websecure"
      - "traefik.http.routers.petrotekno-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.petrotekno-frontend.loadbalancer.server.port=80"

volumes:
  petrotekno_storage:
    name: petrotekno_storage
  petrotekno_database:
    name: petrotekno_database

networks:
  dokploy-network:
    external: true
