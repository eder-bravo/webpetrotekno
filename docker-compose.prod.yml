# Docker Compose para PRODUCCIÓN en Dokploy
#
# Este archivo está optimizado para despliegue en Dokploy
# Los dominios se configuran en la interfaz de Dokploy

services:
  # ==========================================
  # BACKEND - Laravel CMS (PHP + Nginx)
  # ==========================================
  backend:
    build:
      context: ./petrotekno-cms
      dockerfile: Dockerfile
    environment:
      - APP_NAME=${APP_NAME:-Petrotekno CMS}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${BACKEND_URL:-https://cms.petrotekno.com}
      - APP_LOCALE=es
      - APP_FALLBACK_LOCALE=es
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - DB_CONNECTION=sqlite
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
    volumes:
      - petrotekno_storage:/var/www/html/storage/app/public
      - petrotekno_database:/var/www/html/database
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/config" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  # ==========================================
  # FRONTEND - React SPA (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./webpetrotekno
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL:-https://cms.petrotekno.com}
    depends_on:
      backend:
        condition: service_healthy
    restart: always

# ==========================================
# VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  petrotekno_storage:
    name: petrotekno_storage
  petrotekno_database:
    name: petrotekno_database
