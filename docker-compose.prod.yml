# Docker Compose para PRODUCCIÓN en Dokploy
#
# IMPORTANTE: Los servicios DEBEN estar en dokploy-network
# para que Traefik los descubra automáticamente

services:
  # ==========================================
  # BACKEND - Laravel CMS (PHP + Nginx)
  # ==========================================
  backend:
    build:
      context: ./petrotekno-cms
      dockerfile: Dockerfile
    container_name: petrotekno-backend
    environment:
      - APP_NAME=${APP_NAME:-Petrotekno CMS}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${BACKEND_URL:-https://cmspetrotekno.110694.xyz}
      - APP_LOCALE=es
      - APP_FALLBACK_LOCALE=es
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - DB_CONNECTION=sqlite
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
    volumes:
      - petrotekno_storage:/var/www/html/storage/app/public
      - petrotekno_database:/var/www/html/database
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/config" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dokploy-network
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.petrotekno-backend.rule=Host(`cmspetrotekno.110694.xyz`)"
      - "traefik.http.routers.petrotekno-backend.entrypoints=websecure"
      - "traefik.http.routers.petrotekno-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.petrotekno-backend.loadbalancer.server.port=8080"

  # ==========================================
  # FRONTEND - React SPA (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./webpetrotekno
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://cmspetrotekno.110694.xyz
    container_name: petrotekno-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-network
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.petrotekno-frontend.rule=Host(`webpetrotekno.110694.xyz`)"
      - "traefik.http.routers.petrotekno-frontend.entrypoints=websecure"
      - "traefik.http.routers.petrotekno-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.petrotekno-frontend.loadbalancer.server.port=80"

# ==========================================
# VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  petrotekno_storage:
    name: petrotekno_storage
  petrotekno_database:
    name: petrotekno_database

# ==========================================
# RED - Conectar a la red de Dokploy/Traefik
# ==========================================
networks:
  dokploy-network:
    external: true
