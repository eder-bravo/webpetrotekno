user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Timeouts para uploads grandes
    client_body_timeout 300s;
    send_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Buffer para uploads
    client_body_buffer_size 10M;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;

        index index.php index.html;

        charset utf-8;

        # Logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log error;

        # Manejo de archivos estáticos
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Ruta principal - Laravel
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Archivos especiales
        location = /favicon.ico { 
            access_log off; 
            log_not_found off; 
        }
        
        location = /robots.txt  { 
            access_log off; 
            log_not_found off; 
        }

        # PHP-FPM
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            
            # HTTPS deshabilitado para desarrollo local (URLs con http://)
            # fastcgi_param HTTPS on;
            
            # Pasar headers de Inertia
            fastcgi_param HTTP_X_INERTIA $http_x_inertia;
            fastcgi_param HTTP_X_INERTIA_VERSION $http_x_inertia_version;
            
            # Timeouts para requests largos
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
            
            # Buffer settings para mejorar performance
            fastcgi_buffering on;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
        }

        # Denegar acceso a archivos ocultos
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Denegar acceso a archivos sensibles
        location ~ /\.env {
            deny all;
        }

        location ~ /\.git {
            deny all;
        }
    }
}
